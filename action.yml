name: 'Infinite LLM Fallback Router Check'
description: 'Verify multi-provider LLM fallback routing, circuit breaker health, and backoff configuration.'
author: 'HM Shihabuddin Jashory (@jashory)'
branding:
  icon: 'cpu'
  color: 'blue'
inputs:
  args:
    description: 'CLI arguments to pass to fallback_router.py'
    required: false
    default: '--self-test'
runs:
  using: 'composite'
  steps:
    - name: Validate LLM Fallback Router
      shell: bash
      run: python3 "${{ github.action_path }}/fallback_router.py" ${{ inputs.args }}
